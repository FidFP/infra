server {
    listen 80;
    listen [::]:80;

    server_name cafcis.ch www.cafcis.ch;
    server_tokens off;

    root /srv/www/cafcis.ch/current;
    index index.html;

    access_log /var/log/nginx/cafcis.ch.access.log;
    error_log /var/log/nginx/cafcis.ch.error.log;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # Réservé à la validation future des certificats Let's Encrypt.
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    # Ne jamais servir de fichier caché (à l'exception ACME ci-dessus).
    location ~ /\. {
        deny all;
    }
}
